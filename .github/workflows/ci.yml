name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - run: make lint PYTHON=python

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: build
        env:
          SITE_URL: https://lonely-crab.github.io/ssg-research-site/
        run: make build PYTHON=python
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  helios:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: build for helios
        env:
          SITE_URL: https://se.ifmo.ru/~s336402/
        run: make build PYTHON=python
      - name: pack site
        run: tar -C site -czf site.tgz .
      - name: backup public_html
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: helios.cs.ifmo.ru
          username: ${{ secrets.HELIOS_USER }}
          key: ${{ secrets.HELIOS_SSH_KEY }}
          port: 2222
          script: |
            if [ -d public_html ]; then
              rm -rf public_html.prev
              mv public_html public_html.prev
            fi
            mkdir -p public_html
      - name: copy site.tgz
        uses: appleboy/scp-action@v0.1.7
        with:
          host: helios.cs.ifmo.ru
          username: ${{ secrets.HELIOS_USER }}
          key: ${{ secrets.HELIOS_SSH_KEY }}
          port: 2222
          source: site.tgz
          target: "."
          overwrite: true
      - name: unpack
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: helios.cs.ifmo.ru
          username: ${{ secrets.HELIOS_USER }}
          key: ${{ secrets.HELIOS_SSH_KEY }}
          port: 2222
          script: |
            gzip -dc site.tgz | tar -xf - -C public_html
            rm -f site.tgz
      - name: healthcheck
        run: |
          sleep 2
          code="$(curl -sS -o /tmp/helios_index.html -w '%{http_code}' -L --max-time 20 https://se.ifmo.ru/~s336402/)"
          echo "HTTP $code"
          test "$code" = "200"
          grep -q "Задержка" /tmp/helios_index.html
